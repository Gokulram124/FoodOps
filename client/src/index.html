<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoodOps</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
    // Apply the saved theme before Angular loads, so there is no dark flash on a light page
    try {
      var t = localStorage.getItem('foodops_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
